name: Deploy to Firebase Hosting and Release on merge

# Trigger on pushes to master or develop branches
on:
  push:
    branches:
      - master
      - develop

# Queue runs per branch so two quick merges can't deploy or release out of order
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_deploy:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            npm run build
          else
            npm run build -- --mode preview
          fi

      # === Firebase Deployment ===
      # Set correct Firebase Service Account and Project ID based on the branch
      - name: Set Firebase Environment Variables
        id: set_firebase_env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "FIREBASE_SERVICE_ACCOUNT_SECRET_NAME=FIREBASE_SERVICE_ACCOUNT_UT_DNR_UGS_MAPS_PROD" >> $GITHUB_ENV
            echo "PROJECT_ID=ut-dnr-ugs-maps-prod" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "FIREBASE_SERVICE_ACCOUNT_SECRET_NAME=FIREBASE_SERVICE_ACCOUNT_UT_DNR_UGS_MAPS_DEV" >> $GITHUB_ENV
            echo "PROJECT_ID=ut-dnr-ugs-maps-dev" >> $GITHUB_ENV
          fi

      # --- Deploy to DEVELOPMENT Project (if develop branch) ---
      - name: Deploy SPA to Develop Environment (live channel)
        if: github.ref == 'refs/heads/develop'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets[env.FIREBASE_SERVICE_ACCOUNT_SECRET_NAME] }}'
          projectId: '${{ env.PROJECT_ID }}' # ut-dnr-ugs-maps-dev
          channelId: live # Deploy to the main site for the dev project
          target: main-site
          firebaseToolsVersion: '13.29.1'

      # --- Deploy to PRODUCTION Project (if master branch) ---
      - name: Deploy SPA to Production Environment (live channel)
        if: github.ref == 'refs/heads/master'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets[env.FIREBASE_SERVICE_ACCOUNT_SECRET_NAME] }}'
          projectId: '${{ env.PROJECT_ID }}' # ut-dnr-ugs-maps-prod
          channelId: live
          target: main-site 
          firebaseToolsVersion: '13.29.1'

  # --- Deploy the production redirector configurations ---
  # Own job so a redirector failure doesn't block the release of the main site
  deploy_hazards_redirector:
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Redirects win over static files, so the redirector only needs a non-empty public dir
      - name: Create placeholder public dir
        run: mkdir -p dist && touch dist/index.html

      - name: Deploy Hazards Redirector to Production (live channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_UT_DNR_UGS_MAPS_PROD }}'
          projectId: ut-dnr-ugs-maps-prod
          channelId: live
          target: hazards-subdomain
          firebaseToolsVersion: '13.29.1'

  # === Semantic Release (Only on master branch) ===
  # Runs after the main site deploys; creates GitHub releases and tags from commit messages
  release:
    needs: build_deploy
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
      issues: write
      pull-requests: write

    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is needed for semantic-release
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
