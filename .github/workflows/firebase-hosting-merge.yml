name: Deploy to Firebase Hosting and Release on merge

# Trigger on pushes to master or develop branches
on:
  push:
    branches:
      - master
      - develop

jobs:
  # Deploy the review app (same codebase, --mode review) to the live review/app/ subtree in the private
  # review bucket, served behind review-serving's IAP. Develop only for now. Bucket upload, not a Cloud
  # Run deploy — review-serving serves it. Parallel + separate checkout so it never clobbers the Firebase build.
  deploy_review_app:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # WIF: mint the GitHub OIDC token to impersonate the deploy SA (keyless)
    concurrency:
      group: review-app-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build -- --mode review
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/328621131372/locations/global/workloadIdentityPools/github-actions/providers/github-actions-provider
          service_account: review-app-deploy@ut-dnr-ugs-maps-prod.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy review app to bucket
        run: |
          gcloud storage rsync dist gs://ut-dnr-ugs-maps-prod-review/review/app \
            --recursive --delete-unmatched-destination-objects --project ut-dnr-ugs-maps-prod
          gcloud storage objects update gs://ut-dnr-ugs-maps-prod-review/review/app/index.html \
            --cache-control="no-cache,max-age=0" --project ut-dnr-ugs-maps-prod

  build_deploy_release:
    # Permissions needed for semantic-release to push tags/releases
    permissions:
      contents: write
      issues: write
      pull-requests: write

    runs-on: ubuntu-latest
    steps:
      # Checkout code - fetch-depth: 0 is needed for semantic-release
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            npm run build
          else
            npm run build -- --mode preview
          fi

      # === Semantic Release (Only on master branch) ===
      # Creates GitHub releases and tags based on commit messages
      - name: Run Semantic Release
        if: github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # === Firebase Deployment ===
      # Set correct Firebase Service Account and Project ID based on the branch
      - name: Set Firebase Environment Variables
        id: set_firebase_env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "FIREBASE_SERVICE_ACCOUNT_SECRET_NAME=FIREBASE_SERVICE_ACCOUNT_UT_DNR_UGS_MAPS_PROD" >> $GITHUB_ENV
            echo "PROJECT_ID=ut-dnr-ugs-maps-prod" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "FIREBASE_SERVICE_ACCOUNT_SECRET_NAME=FIREBASE_SERVICE_ACCOUNT_UT_DNR_UGS_MAPS_DEV" >> $GITHUB_ENV
            echo "PROJECT_ID=ut-dnr-ugs-maps-dev" >> $GITHUB_ENV
          fi

      # --- Deploy to DEVELOPMENT Project (if develop branch) ---
      - name: Deploy SPA to Develop Environment (live channel)
        if: github.ref == 'refs/heads/develop'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets[env.FIREBASE_SERVICE_ACCOUNT_SECRET_NAME] }}'
          projectId: '${{ env.PROJECT_ID }}' # ut-dnr-ugs-maps-dev
          channelId: live # Deploy to the main site for the dev project
          target: main-site
          firebaseToolsVersion: '13.29.1'

      # --- Deploy to PRODUCTION Project (if master branch) ---
      - name: Deploy SPA to Production Environment (live channel)
        if: github.ref == 'refs/heads/master'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets[env.FIREBASE_SERVICE_ACCOUNT_SECRET_NAME] }}'
          projectId: '${{ env.PROJECT_ID }}' # ut-dnr-ugs-maps-prod
          channelId: live
          target: main-site 
          firebaseToolsVersion: '13.29.1'

      # --- Deploy the production redirector configurations ---
      - name: Deploy Hazards Redirector to Production (live channel)
        if: github.ref == 'refs/heads/master'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets[env.FIREBASE_SERVICE_ACCOUNT_SECRET_NAME] }}'
          projectId: '${{ env.PROJECT_ID }}' # ut-dnr-ugs-maps-prod
          channelId: live
          target: hazards-subdomain
          firebaseToolsVersion: '13.29.1'

      # === Sync master back to develop (Only on master branch) ===
      # After semantic-release commits CHANGELOG.md and package.json updates,
      # merge those changes back to develop so it stays in sync
      - name: Sync master back to develop
        if: github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout develop
          git merge master --no-edit
          git push origin develop